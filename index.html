<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METARECALL Pixel Adventure</title><style>body{margin:0;background:#101827;color:white;font:16px system-ui;text-align:center}h1{margin:12px}canvas{width:min(96vw,960px);background:#78c9f5;border:3px solid #60a5fa;border-radius:12px;image-rendering:pixelated}.controls{display:flex;justify-content:center;gap:10px;margin:12px;flex-wrap:wrap}button{padding:14px 22px;background:#263449;color:white;border:1px solid #60a5fa;border-radius:12px;font-size:18px;touch-action:none}</style><h1>🎮 METARECALL — Pixel Adventure</h1><p>Attrape les pièces et rejoins le drapeau !</p><canvas id="c" width="960" height="540"></canvas><div class="controls"><button id="l">⬅</button><button id="j">⬆ SAUT</button><button id="r">➡</button><button onclick="reset()">↻ Recommencer</button></div><p>Clavier : ← → ou A/D • saut : espace / ↑ / W</p><script>const c=document.getElementById('c'),x=c.getContext('2d');let p,coins,enemies,score,win,keys={};const plat=[{x:0,y:490,w:960},{x:160,y:420,w:130},{x:340,y:355,w:125},{x:520,y:295,w:135},{x:700,y:390,w:120},{x:830,y:315,w:100},{x:620,y:470,w:90}];function reset(){p={x:55,y:400,w:32,h:42,vx:0,vy:0};score=0;win=false;coins=[205,250,390,435,570,620,740,865,900].map((a,i)=>({x:a,y:[380,380,315,315,255,255,350,275,275][i]}));enemies=[315,475,670].map(a=>({x:a,y:458,v:1.4}));}reset();function key(k,on){keys[k]=on}onkeydown=e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='r')reset()};onkeyup=e=>keys[e.key.toLowerCase()]=false;function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();key(k,true)};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>key(k,false)}bind('l','arrowleft');bind('r','arrowright');bind('j',' ');function loop(){p.vx=(keys.arrowright||keys.d?3.5:0)-(keys.arrowleft||keys.a?3.5:0);if((keys[' ']||keys.arrowup||keys.w)&&p.ground){p.vy=-11;p.ground=false}p.vy+=.48;p.x=Math.max(0,Math.min(928,p.x+p.vx));p.y+=p.vy;p.ground=false;for(let q of plat)if(p.x<q.x+q.w&&p.x+p.w>q.x&&p.y+p.h>=q.y&&p.y+p.h-p.vy<=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.ground=true}coins=coins.filter(o=>{if(p.x<o.x+12&&p.x+p.w>o.x-12&&p.y<o.y+12&&p.y+p.h>o.y-12){score++;return false}return true});enemies.forEach(e=>{e.x+=e.v;if(e.x<100||e.x>850)e.v*=-1;if(p.x<e.x+28&&p.x+p.w>e.x&&p.y+p.h>e.y&&p.y<e.y+30){if(p.vy>0){e.x=-100;score++}else reset()}});if(p.y>540)reset();if(p.x>910&&p.y<300)win=true;draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,960,540);x.fillStyle='#78c9f5';x.fillRect(0,0,960,540);for(let i=0;i<7;i++){x.fillStyle='#fff';x.beginPath();x.arc(i*170+50,70+(i%3)*25,25,0,Math.PI*2);x.fill()}plat.forEach(q=>{x.fillStyle='#8b5a2b';x.fillRect(q.x,q.y,q.w,q.h||50);x.fillStyle='#42b883';x.fillRect(q.x,q.y,q.w,7)});coins.forEach(o=>{x.fillStyle='#ffcf33';x.beginPath();x.arc(o.x,o.y,10,0,Math.PI*2);x.fill()});enemies.forEach(e=>{x.fillStyle='#e65b65';x.fillRect(e.x,e.y,28,30);x.fillStyle='#fff';x.fillRect(e.x+6,e.y+8,5,7);x.fillRect(e.x+17,e.y+8,5,7)});x.fillStyle='#273c75';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#fff';x.fillRect(p.x+8,p.y+9,5,5);x.fillRect(p.x+19,p.y+9,5,5);x.fillStyle='#d94b4b';x.fillRect(p.x-3,p.y-5,38,9);x.fillStyle='#222';x.fillRect(915,250,5,90);x.fillStyle='#ff4d6d';x.beginPath();x.moveTo(920,250);x.lineTo(965,265);x.lineTo(920,280);x.fill();x.fillStyle='#fff';x.font='bold 22px system-ui';x.fillText('🪙 '+score,25,35);if(win){x.fillStyle='rgba(12,20,35,.75)';x.fillRect(0,0,960,540);x.fillStyle='#fff';x.textAlign='center';x.font='bold 46px system-ui';x.fillText('NIVEAU TERMINÉ ! 🎉',480,250);x.font='24px system-ui';x.fillText('Pièces récoltées : '+score+' — Appuie sur R pour rejouer',480,300);x.textAlign='left'}}loop();</script></html>
